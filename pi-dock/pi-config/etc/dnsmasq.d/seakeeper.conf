# DHCP for the Seakeeper, scoped to enp2s0 ONLY.
#
# The unit is a DHCP client with no server to talk to, so it falls back to an
# APIPA 169.254.x.x address that changes between boots. Pinning it by MAC makes
# 192.168.0.2 the address every launcher, bookmark and document already uses.
#
# Measured 2026-11-21 — see seakeeper-link.md at the repo root.
#
# port=0 is deliberate: DHCP only, no DNS. A dnsmasq that binds 0.0.0.0:53
# breaks the BoatNetwork AP (MIGRATION.md §8), and dnsmasq refuses to start as
# a second instance while NetworkManager's own one holds the port.

interface=enp2s0
bind-dynamic
port=0

dhcp-range=192.168.0.100,192.168.0.200,12h
dhcp-host=1c:95:9f:07:22:70,192.168.0.2,12h

# No gateway and no DNS: this link must stay a two-node island.
dhcp-option=3
dhcp-option=6
