; SEAKEEPER RELAY — WT32-ETH01 (ESP32 + LAN8720) Wi-Fi <-> Ethernet byte pipe.
; Listens on BoatNetwork for the N100, forwards TCP to the SeaKeeper on
; Ethernet. No NAT, no routing: the board only moves bytes.
;
; ESP-IDF framework rather than Arduino: the job is pure networking and it
; needs IDF 5.x (esp_eth_netif_glue / esp_eth_mac_esp), which also matches the
; v5.5 firmware that previously ran on this board.
[env:seakeeper-relay]
platform = espressif32@6.12.0
board = wt32-eth01
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
; 3 MB app partition; without this PlatformIO reports sizes against its own
; 1 MB default even though ESP-IDF uses the custom table.
board_build.partitions = partitions.csv

; sdkconfig.defaults (this directory) seeds the generated sdkconfig.
